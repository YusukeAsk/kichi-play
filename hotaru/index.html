<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ファミコン風のドット絵で遊ぶ、夏休み12日間の釣りRPG。川をさかのぼって、じいちゃんが50年前に逃した「ぬし」を釣ります。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>ほたる川つりにっき</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* レイアウト：畳の部屋に置いたブラウン管と、その前のコントローラー。縦画面はテレビ＋手元パッド、横長スマホは左右に分かれる */
:root{
  --room:#3a4a2a; --tatami:#4c5c34; --wood:#6a4628; --wood-hi:#8c6238; --wood-lo:#402a18;
  --pad:#e8dcc0; --pad-lo:#b8a888; --ink:#2a1c14; --red:#a82820; --cream:#f4ecd8;
  --dot:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--room);background-image:repeating-linear-gradient(0deg,var(--tatami) 0 2px,var(--room) 2px 5px);color:var(--cream);font-family:var(--dot);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#tv{flex:1 1 auto;min-height:0;width:100%;max-width:980px;display:flex;background:linear-gradient(180deg,var(--wood-hi),var(--wood) 12%,var(--wood-lo));border-radius:14px;padding:12px;box-sizing:border-box;box-shadow:0 6px 0 #1c2410}
#stage{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:#08080c;border-radius:10px;overflow:hidden;position:relative}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;outline:none}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px);border-radius:10px}
#pad{flex:0 0 auto;width:100%;max-width:520px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--pad);color:var(--ink);border-radius:12px;padding:10px 16px;box-sizing:border-box;box-shadow:0 4px 0 var(--pad-lo)}
#dpad{position:relative;width:108px;height:108px;touch-action:none;cursor:pointer}
#dpad i{position:absolute;background:var(--ink);border-radius:3px}
#dpad i:nth-child(1){left:36px;top:0;width:36px;height:108px}
#dpad i:nth-child(2){left:0;top:36px;width:108px;height:36px}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.pill{border:0;font:inherit;font-size:12px;background:var(--ink);color:var(--pad);padding:6px 12px;border-radius:12px;touch-action:none;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--red)}
.ab{display:flex;gap:12px;align-items:center;transform:rotate(-14deg)}
.ab button{width:58px;height:58px;border-radius:50%;border:0;background:var(--red);color:var(--cream);font:inherit;font-size:20px;box-shadow:0 3px 0 #601410;touch-action:none;cursor:pointer}
.ab button.on{transform:translateY(2px);box-shadow:0 1px 0 #601410}
.pill:focus-visible,.ab button:focus-visible,#snd:focus-visible{outline:2px solid #f8d030;outline-offset:2px}
#screen:focus-visible{outline:none}
#keys{flex:0 0 auto;font-size:14px;color:var(--cream);letter-spacing:.04em;display:none;text-align:center}
#keys b{font-weight:400;color:#f8d030}
#snd{font:inherit;font-size:12px;background:none;border:1px solid var(--pad-lo);color:inherit;padding:3px 8px;border-radius:4px;cursor:pointer}
@media (max-width:600px),(max-height:520px){
  body{padding-block:6px;gap:8px}
  #tv{padding:4px;border-radius:8px;box-shadow:0 3px 0 #1c2410}
  #stage{border-radius:5px}
}
@media (hover:hover) and (pointer:fine) and (min-height:560px){
  #pad{display:none}
  #keys{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
}
@media (max-height:520px) and (orientation:landscape){
  body{flex-direction:row;padding-block:4px;gap:8px}
  #pad{display:contents}
  #dpad{order:0;flex:0 0 108px}
  #tv{order:1;padding:6px;height:100%}
  .mid{position:fixed;top:6px;right:max(16px,env(safe-area-inset-right,0px));align-items:flex-end;gap:4px}
  .mid .pill{padding:4px 8px}
  .ab{order:3;flex-direction:column;transform:none;margin-top:44px}
}
</style>
</head>

<div id="pad">

</div>

class Choice{
  constructor(items,o,res){
    this.items=items;this.res=res;this.i=o.i||0;this.cancel=o.cancel;this.top=0;this.rows=o.rows||items.length;
    const w=Math.max(...items.map(s=>textW(typeof s==='string'?s:s.t)),o.minW||0)+30;

    if(rep('down')){this.i=(this.i+1)%n;SFX.move();if(this.onMove)this.onMove(this.i)}
    if(this.i<this.top)this.top=this.i;

let last=0,acc=0;
const STEP=1000/60;
function tick(){
  pollInput();tickN++;

  if(fadeA!==fadeTo){fadeA=fadeA<fadeTo?Math.min(fadeTo,fadeA+fadeSpd):Math.max(fadeTo,fadeA-fadeSpd);if(fadeA===fadeTo&&fadeRes){const r=fadeRes;fadeRes=null;r()}}
  if(ui.length)ui[ui.length-1].update();

  if(scene&&scene.draw)scene.draw();

  if(toast.t>0&&toast.s){const w=textW(toast.s)+14;const x=(SW-w)>>1;win(x,22,w,18);text(toast.s,x+7,25)}
  if(fadeA>0){const q=Math.ceil(fadeA*5)/5;g.globalAlpha=q;R(0,0,SW,SH,fadeCol);g.globalAlpha=1}

  requestAnimationFrame(frame);

  if(n)render();
}

function lineMax(){return LINES[S.line].max}
/* 綱引きの計算（描画と切り離して難易度を調整できるようにしている） */
function fightStep(F,dt,hold,P){
  const absorb=P?P.absorb:RODS[S.rod].absorb,tire=P?P.tire:RODS[S.rod].tire,lm=P?P.line:lineMax(),lv=P?P.lv:S.lv;
  const hf=Math.max(0,F.hp/F.hpMax);
  F.tmr-=dt;
  if(F.tmr<=0){
    if(F.mode==='rest'&&hf>0){
      F.next='run';
      if(F.f.boss&&F.ph<2&&hf<(F.ph===0?.66:.33)){F.ph++;F.next='jump'}
      F.mode='warn';F.tmr=.42;F.warnTick=1;
    }else if(F.mode==='warn'){F.mode=F.next;F.tmr=F.next==='jump'?1.0:rnd(.6,1.3)*(.7+F.f.tm*.6)*(.5+.5*hf);F.T+=F.pow*(F.next==='jump'?13:9)/absorb}
    else{F.mode='rest';F.tmr=rnd(1.1,2.4)/(.55+F.f.tm*.7)*(hf<.3?1.5:1)}
  }
  const m=F.mode==='run'?.55+.45*hf:F.mode==='jump'?1.7:.3;
  const pull=F.pow*m/absorb;
  const eq=hold?32+36*pull:6+9*pull,rate=hold?3.2:3.4;
  F.T+=(eq-F.T)*rate*dt;
  const reel=(25+2.2*lv)*(P?1:(S.hp>0?1:.5));
  if(hold){
    F.D-=reel*(1.05-.72*hf)*(F.mode==='run'||F.mode==='jump'?.1:1)*dt;
    F.D+=(F.mode==='run'?F.pow*3:0)*dt;
    if(!P)S.hp=Math.max(0,S.hp-dt*(.45+F.pow*.14));
  }else if(F.mode==='run'||F.mode==='jump')F.D+=F.pow*15*dt;
  F.D=Math.min(F.D,204);
  F.hp-=(F.T>22?(.3+F.T/110)*tire:.1)*dt;
  if(F.T>=lm){F.over+=dt;if(F.over>.2)return 'broke'}else F.over=0;
  if(F.T<13&&F.mode!=='run'&&F.mode!=='jump'&&F.D>14){F.slack+=dt;if(F.slack>1.6)return 'spit'}else F.slack=0;
  if(F.D<=12)return 'land';
  return null;
}

function recordCatch(f,cm){
  const r=S.rec[f.id];const isNew=!r,isRec=r&&cm>r.cm;
  if(!r||cm>r.cm)S.rec[f.id]={cm};
  if(!f.junk){S.total++;S.today.n++;S.today.kinds[f.name]=1;if(!S.today.best||cm>S.today.best.cm)S.today.best={img:f.img,name:f.name,cm};if(!S.biggest||cm>S.biggest.cm)S.biggest={name:f.name,cm}}
  return{isNew,isRec};
}

  await say('ぼくは ハリを そっと ぬいた。');
  const c=await choose(['川に かえす','いえに もちかえる'],{x:120,y:118});
  delete sc.draw;
  S.rec.nushi={cm:98};S.total++;S.biggest={name:'ほたる川の ぬし',cm:98};S.today.n++;S.today.kinds['ぬし']=1;S.today.best={img:'nushi',name:'ぬし',cm:98};
  if(c===0){S.f.nushi='free';S.today.nushi='ぬしを つった。 じいちゃんの ハリを ぬいて 川に かえした。 くろい せなかが ゆっくり しずんでいった。 ほたるが たくさん とんでいた。';
    await fade(1,24);sc.res=null;sc.st='aim';await fade(0,24);
    await say('ぬしは いちど こちらを みて\nゆっくりと ふちの そこへ しずんでいった。\nほたるが いっせいに まいあがった。');
  }else{S.f.nushi='keep';S.today.nushi='ぬしを つった。 いえに もってかえったら 村じゅうの ひとが みにきた。 じいちゃんは だまって ぎょたくを とった。 たきつぼは しずかに なった。';
    await fade(1,24);sc.res=null;sc.st='aim';await fade(0,24);
    await say('ぬしは おもかった。\nせなかの うえで いちどだけ ゆっくり うごいた。');
  }
  S.items.hook=1;
  await gainExp(0);
  sc.restoreMusic();sc.msg='';
}

/* わかれ */
async function farewell(){
  S.day=11;S.min=8*60;S.map='world';S.x=15;S.y=115;S.dir='up';
  const stay=walk;
  setScene(stay);stay.np=[];stay.p.px=S.x*16;stay.p.py=S.y*16;applyFlags();
  stay.np=[{id:'jii',x:14,y:114,tx:14,ty:114,px:14*16,py:114*16,dir:'down',spr:SPR.jii},{id:'baa',x:16,y:115,tx:16,ty:115,px:16*16,py:115*16,dir:'left',spr:SPR.baa}];
  AUDIO.play('title');
  await dayCard(DAYS[11]);stay.np=stay.np;await fade(0,30);
  const J='じいちゃん',B='ばあちゃん';
  await say('「わすれものは ないかい。 おにぎり、 でんしゃで たべなさい」',B);
  if(S.f.nushi==='free'){
    await say('たきつぼの はなしは きいた。\n…おまえの ほうが わしより ずっと つりびとじゃ。',J);
    await say('ぼくは ポケットから ふるい ハリを だして じいちゃんに わたした。');
    await say('じいちゃんは それを ずっと てのひらで ころがしていた。');
  }else if(S.f.nushi==='keep'){
    await say('ぎょたくは とこのまに かざっておく。\nまた みにこい。',J);
    await say('ぼくは ポケットから ふるい ハリを だして じいちゃんに わたした。\nじいちゃんは ながいこと それを みていた。');
  }else{
    await say('ぬしは まだ たきつぼに おる。\nまた らいねんじゃな。',J);
    await say('らいねんも この川は ここに ある。\nわしも ここで まっとるからの。',J);
  }
  await say('ガタン、 ゴトン。\nでんしゃが ホームに はいってきた。');
  await fade(1,40);
  const tr=new TrainScene(true);setScene(tr);await fade(0,40);
  await say('まどの そとを 川が ながれていく。\nじいちゃんと ばあちゃんが ちいさくなる。');
  await say('セミの こえが だんだん きこえなくなった。');
  await wait(120);await fade(1,50);
  const es=new EndScene();setScene(es);AUDIO.play('ending');await fade(0,50);await es.done;
  S.finished=true;saveGame();
  await fade(1,60);setScene(new TitleScene());await fade(0,40);
}
class TrainScene{
  constructor(sunset){this.sc=0;this.s=sunset}
  update(){this.sc+=1.6}
  draw(){
    const K=this.s?['#f8b880','#f8d0a0','#f8e8c8']:['#58a8f0','#88c8f8','#c8ecf8'];
    R(0,0,SW,50,K[0]);R(0,50,SW,40,K[1]);R(0,90,SW,50,K[2]);
    if(this.s){R(170,70,26,26,'#f87040')}
    for(let i=0;i<SW;i+=2){const w=i+this.sc*.15;const h=92+Math.sin(w/34)*12+Math.sin(w/13)*5;R(i,h,2,70,this.s?'#a07090':'#6ca0b8')}
    for(let i=0;i<SW;i+=2){const w=i+this.sc*.4;const h=118+Math.sin(w/26)*7;R(i,h,2,40,this.s?'#6c7040':'#409050')}
    for(let i=0;i<SW;i+=2){const w=i+this.sc;R(i,136,2,32,'#2878e0');if(hash(Math.floor(w/9),2)%3===0)R(i,138+hash(Math.floor(w/9),5)%24,2,1,'#c8ecf8')}
    const p=(this.sc*3)%210;R(SW-p,30,3,150,'#402c18');R(SW-p-6,40,15,2,'#402c18');R(SW-p+18,44,230,1,'#402c18');
    R(0,0,SW,20,'#785030');R(0,158,SW,82,'#785030');R(0,0,14,SH,'#785030');R(SW-14,0,14,SH,'#785030');R(0,158,SW,3,'#a87840');R(126,20,4,138,'#785030');
    R(14,20,SW-28,1,'#402c18');
  }
}
class EndScene{
  constructor(){
    this.done=new Promise(r=>this.res=r);this.t=0;
    const N=S.f.nushi;
    this.L=[
      {s:'8がつ 31にち',c:'#f8d030'},{s:''},
      {s:N==='free'?'ほたる川の ぬしを つって かえした。':N==='keep'?'ほたる川の ぬしを つった。':'ぬしには あえなかった。'},
      {s:'つった さかな '+S.total+' ひき'},
      {s:'ずかん '+caughtKinds()+' / 13 しゅるい'},
      {s:S.biggest?'いちばん 大きいの '+S.biggest.name:''},{s:S.biggest?'　'+S.biggest.cm+' センチ':''},
      {s:''},{s:'おとなに なった いまでも'},{s:'セミの こえを きくと'},{s:'あの 川の においが する。'},{s:''},{s:'おわり',c:'#f8d030'}];
    this.shown=0;this.fin=false;
  }
  update(){this.t++;if(this.t%50===0&&this.shown<this.L.length)this.shown++;if(this.shown>=this.L.length&&!this.fin&&press.a){this.fin=true;this.res()}if(press.a&&this.shown<this.L.length)this.shown++}
  draw(){
    R(0,0,SW,SH,'#0c1028');
    for(let i=0;i<20;i++){const v=hash(i,5);const x=(v%SW)+Math.sin(tickN/50+i)*8,y=((v>>8)%SH)-((tickN/3+i*11)%50)*.4;if(Math.sin(tickN/20+i*2)>-.2)R(x,y,2,2,'#e8f868')}
    this.L.slice(0,this.shown).forEach((l,i)=>{if(l.s)text(l.s,(SW-textW(l.s))>>1,22+i*15,l.c||'#f8f8f0')});
    if(this.shown>=this.L.length&&(tickN>>5)&1)text('Aボタン',(SW-42)>>1,220,'#808898');
  }
}

/* タイトル */
function titleArt(){
  const c=mk(SW,SH),x=c.getContext('2d'),r=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a,b,w,h)},rand=mulberry(808);
  [[0,'#3c98e8'],[30,'#50a8ec'],[60,'#68b8f0'],[86,'#88c8f4'],[108,'#a8d8f8'],[124,'#c8e8f8']].forEach(([y,col])=>r(0,y,SW,40,col));
  const puff=(a,b,s,lit)=>{r(a-s,b-s*.6,s*2,s*1.2,lit);r(a-s*.6,b-s,s*1.2,s*2,lit)};
  for(let i=0;i<70;i++){const t=rand(),a=150+(rand()-.5)*170*(.32+t*.78),b=128-t*110*(1-Math.abs(a-160)/170),s=7+rand()*11;puff(a+3,b+3,s,'#c0d4e4')}
  for(let i=0;i<70;i++){const t=rand(),a=150+(rand()-.5)*160*(.32+t*.78),b=124-t*110*(1-Math.abs(a-160)/170),s=7+rand()*11;puff(a,b,s,'#f8f8f0')}
  for(let i=0;i<SW;i+=2){const h=132+Math.sin(i/38)*9+Math.sin(i/15)*3;r(i,h,2,40,'#6ca8c0')}
  for(let i=0;i<SW;i+=2){const h=144+Math.sin(i/26+2)*5;r(i,h,2,40,'#2c8048')}
  r(0,158,SW,82,'#58a848');for(let j=160;j<200;j+=3)for(let i=(j%2)*3;i<SW;i+=6)r(i,j,2,1,'#88c858');
  for(let j=0;j<62;j++){const w=j*2+40,c0=150+Math.sin(j/9)*24-j*.9;r(c0-w/2,178+j,w,1,'#2878e0');if(j%3===0)for(let i=0;i<3;i++)r(c0-w/2+rand()*w,178+j,8,1,'#88c8f8')}
  /* 電柱 */
  r(38,92,3,76,'#402c18');r(30,100,19,2,'#402c18');r(32,106,15,2,'#402c18');x.fillStyle='#402c18';for(let i=0;i<216;i+=2)x.fillRect(40+i,100+Math.sin(i/216*3.14)*11,2,1);
  return c;
}
class TitleScene{
  constructor(){this.art=titleArt();this.opened=false}
  enter(){AUDIO.play('title')}
  update(){
    if(busy)return;
    if(!this.opened){if(press.a||press.start){AUDIO.unlock();AUDIO.play('title',true);SFX.ok();this.opened=true;runScript(()=>titleMenu())}}
  }
  draw(){
    g.drawImage(this.art,0,0);
    const bob=(tickN>>5)&1;
    g.drawImage(SPR.boy.right[0],64,186);pline(78,194,112,176,'#604020');curve(112,176,132,204+bob,5,'#f8f8f0');
    textO('ほたる川',38,20,'#f8f8f0','#143070',3,2);
    textO('つりにっき',100,64,'#f8d030','#702810',2,2);
    if(!this.opened&&(tickN>>5)%2===0){const s='Aボタンを おしてね';win(72,214,112,20);text(s,(SW-textW(s))>>1,218)}
  }
}
async function titleMenu(){
  const sv=loadGame(),live=sv&&!sv.finished;
  const L=live?['つづきから','はじめから']:['はじめから'];
  const i=await choose(L,{x:88,y:190-(L.length-1)*15,w:96});
  if(live&&i===0){S=sv;await fade(1,24);startWalk();await morningResume();return}
  S=newState(sv);await opening();
}
function startWalk(){walk=new WalkScene();setScene(walk)}
async function morningResume(){S.min=Math.max(S.min,6*60+40);await morning()}
async function opening(){
  await fade(1,30);
  const tr=new TrainScene(false);setScene(tr);AUDIO.play('title');await fade(0,30);
  await say('8がつ 20にち。\nぼくは ひとりで でんしゃに のって\nじいちゃんの 村へ むかっている。');
  await say('ことしの なつやすみは のこり 12にち。\nおかあさんが だして くれた おこづかいは 200えん。');
  await fade(1,30);
  startWalk();walk.music();await fade(0,30);
  const J='じいちゃん';
  await say('ホームに おりると セミの こえが ふってきた。');
  await say('おう、 よう きたな。 おおきく なったのう。',J);
  SFX.item();
  await say('ほれ、 わしの ふるい のべざおじゃ。\nミミズも ほっといた。 川は ひがしじゃ。',J);
  await say('のべざおと ミミズを もらった！');
  await say('さかなを つったら みせに こい。\nいえは きたの みち、 ひまわりの ところじゃ。',J);
  S.f.rod=1;walk.refresh();
  await say('STARTボタンで いまの めあてを かくにんできる。\n川に むかって Aボタンで つりが はじまる。');
}


/* ---------- 起動 ---------- */
function layout(){
  const tv=document.getElementById('tv'),box=document.getElementById('stage'),padEl=document.getElementById('pad');
  tv.style.flex='';tv.style.height='';cv.style.width='1px';cv.style.height='1px';
  const d=window.devicePixelRatio||1,aw=box.clientWidth,ah=box.clientHeight,fit=Math.min(aw/SW,ah/SH);
  let sc=Math.max(1,Math.floor(fit*d))/d;
  if(sc<fit*.8)sc=fit;
  cv.style.width=SW*sc+'px';cv.style.height=SH*sc+'px';
  const portrait=innerHeight>innerWidth&&getComputedStyle(padEl).display!=='none';
  if(portrait){tv.style.flex='0 0 auto';tv.style.height=(SH*sc+8)+'px'}
}
addEventListener('resize',layout);
function bindPad(){
  document.querySelectorAll('[data-btn]').forEach(el=>{
    const b=el.dataset.btn;
    const on=e=>{e.preventDefault();AUDIO.unlock();touchHeld[b]=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}};
    const off=e=>{touchHeld[b]=false;el.classList.remove('on')};
    el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);
  });
  const pad=document.getElementById('dpad');
  if(pad){
    const set=e=>{const r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;['up','down','left','right'].forEach(k=>touchHeld[k]=false);if(Math.hypot(x,y)<r.width*.1)return;
      if(Math.abs(x)>Math.abs(y))touchHeld[x<0?'left':'right']=true;else touchHeld[y<0?'up':'down']=true;pad.dataset.dir=x};
    const clr=()=>['up','down','left','right'].forEach(k=>touchHeld[k]=false);
    pad.addEventListener('pointerdown',e=>{e.preventDefault();AUDIO.unlock();try{pad.setPointerCapture(e.pointerId)}catch(_){}set(e)});
    pad.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')set(e)});
    pad.addEventListener('pointerup',clr);pad.addEventListener('pointercancel',clr);pad.addEventListener('lostpointercapture',clr);
  }
  ['snd','snd2'].forEach(id=>{const s=document.getElementById(id);if(s)s.addEventListener('click',()=>{toggleSound();cv.focus()})});
  cv.addEventListener('pointerdown',()=>{cv.focus();AUDIO.unlock();if(scene instanceof TitleScene&&!scene.opened){touchHeld.a=true;setTimeout(()=>{touchHeld.a=false},90)}});
}
function start(data){
  bindPad();layout();cv.focus();
  if(data&&data.save&&data.mode==='walk'){S=data.save;startWalk()}else setScene(new TitleScene());
  window.claude?.hot?.snapshot?.(()=>({save:S,mode:scene===walk?'walk':'title'}));
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
