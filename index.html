<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>play｜ブラウザですぐ遊べる小さなゲーム</title>
<meta name="description" content="ブラウザですぐ遊べる、小さなゲームを集めた遊び場です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141a2e;
    --panel: #1d2541;
    --ink: #f2f0e6;
    --sub: #9aa3c7;
    --line: #36406a;
    --yellow: #f8d030;
    --green: #58d068;
    --red: #e85848;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 16px 16px;
    color: var(--ink);
    font-family: "DotGothic16", "Hiragino Sans", "Meiryo", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 64px 16px 72px; }

  header { text-align: center; }
  h1 {
    font-size: 56px; letter-spacing: .18em; padding-left: .18em; line-height: 1;
    color: var(--yellow);
    text-shadow: 4px 4px 0 var(--red);
  }
  .press { margin-top: 18px; font-size: 14px; color: var(--sub); letter-spacing: .3em; animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .press { animation: none; } }

  .list { margin-top: 48px; list-style: none; display: grid; gap: 16px; }
  .game {
    display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center;
    padding: 16px;
    background: var(--panel);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 #0a0e1c;
  }
  .icon {
    width: 64px; height: 64px; display: grid; place-items: center;
    background: var(--bg); border: 2px solid var(--line);
    font-size: 30px; line-height: 1;
  }
  .game b { display: block; font-size: 19px; font-weight: 400; }
  .game span { display: block; color: var(--sub); font-size: 13px; }
  a.game { color: inherit; text-decoration: none; transition: transform .08s, box-shadow .08s; }
  a.game:hover, a.game:focus-visible { transform: translate(-2px,-2px); box-shadow: 8px 8px 0 #0a0e1c; border-color: var(--yellow); outline: none; }
  a.game:active { transform: translate(3px,3px); box-shadow: 3px 3px 0 #0a0e1c; }
  .ready {
    display: inline-block; margin-top: 6px; padding: 0 8px;
    background: var(--yellow); color: var(--bg);
    font-size: 12px; font-style: normal; letter-spacing: .15em;
  }
  .soon {
    display: inline-block; margin-top: 6px; padding: 0 8px;
    background: var(--bg); border: 1px solid var(--green); color: var(--green);
    font-size: 11px; letter-spacing: .15em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>PLAY</h1>
    <p class="press">PRESS START</p>
  </header>

  <ul class="list">
    <li>
      <a class="game" href="/hotaru/">
        <div class="icon" aria-hidden="true">🎣</div>
        <div>
          <b>ほたる川 つりにっき</b>
          <span>夏休み12日間の、ファミコン風つりRPG</span>
          <em class="ready">▶ あそぶ</em>
        </div>
      </a>
    </li>
    <li>
      <a class="game" href="/tashigurui/">
        <div class="icon" aria-hidden="true">➕</div>
        <div>
          <b>足し狂い</b>
          <span>次々と現れる数字を足しまくる、ハイスピード足し算ゲーム</span>
          <em class="ready">▶ あそぶ</em>
        </div>
      </a>
    </li>
    <li>
      <a class="game" href="/pitrunner/">
        <div class="icon" aria-hidden="true">⛏️</div>
        <div>
          <b>ピットランナー</b>
          <span>穴を掘って番人を落とし、金塊を集めて脱出する（全12ステージ）</span>
          <em class="ready">▶ あそぶ</em>
        </div>
      </a>
    </li>
  </ul>

</div>
</body>
</html>
